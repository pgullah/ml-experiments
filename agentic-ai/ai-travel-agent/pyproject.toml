[project]
name = "ai-travel-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.0",
    "langchain>=1.3.17",
    "langchain-openai>=1.6.0",
    "langchain-openrouter>=0.2.8",
    "langgraph>=1.2.11",
    "openai>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]
ui = [
    "streamlit>=1.63.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
