[project]
name = "ai-travel-agent"
version = "0.1.0"
description = "Conversational travel planner built with LangGraph and live data tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.0",
    "fastapi>=0.141.1",
    "langchain>=1.3.17",
    "langchain-openai>=1.6.0",
    "langchain-openrouter>=0.2.8",
    "langgraph>=1.2.11",
    "openai>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.34.2",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pyright>=1.1.405",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]
ui = [
    "streamlit>=1.63.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[project.scripts]
travel-agent = "main:chat"

[tool.pyright]
include = ["app", "api.py", "main.py", "streamlit_app.py"]
pythonVersion = "3.12"
venvPath = ".."
venv = ".venv"
